<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Rudra Arts #1771</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;background:#080808;color:#fff;display:grid;place-items:center;padding:24px}.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 10%,rgba(255,132,0,.18),transparent 35%),linear-gradient(135deg,#080808,#15100a);z-index:-1}.card{width:min(440px,100%);background:rgba(20,20,20,.96);border:1px solid rgba(255,138,0,.28);border-radius:24px;padding:32px;box-shadow:0 24px 80px rgba(0,0,0,.55)}.brand{text-align:center;margin-bottom:26px}.brand img{width:82px;height:82px;object-fit:contain;border-radius:18px;margin-bottom:10px}.eyebrow{color:#ff922e;font-size:12px;font-weight:800;letter-spacing:2px}.brand h1{margin:5px 0;font-size:28px}.brand p{color:#aaa;margin:6px 0}.field{margin:16px 0}.field label{display:block;font-size:13px;color:#ccc;margin-bottom:8px}.field input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #333;background:#0d0d0d;color:#fff;outline:none}.field input:focus{border-color:#ff8a00}.btn{width:100%;border:0;border-radius:12px;padding:14px;background:#ff8a00;color:#111;font-weight:900;cursor:pointer;margin-top:8px}.btn:hover{background:#ff9d2e}.msg{min-height:20px;color:#ff7070;text-align:center;font-size:13px;margin-top:12px}.back{display:block;text-align:center;color:#aaa;text-decoration:none;margin-top:20px;font-size:14px}.back:hover{color:#fff}.hint{font-size:12px;color:#888;text-align:center;margin-top:14px;line-height:1.5}</style></head><body><div class="bg"></div><main class="card"><div class="brand"><img src="/assets/logo.png" alt="Rudra Arts logo"><div class="eyebrow">RUDRA ARTS #1771</div><h1>Admin Login</h1><p>Secure access for Super Admin & Admin</p></div><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" placeholder="admin@example.com" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="Enter password" autocomplete="current-password" required></div><button class="btn" type="submit">Login to Admin Panel</button><div class="msg" id="msg"></div><button type="button" class="btn" style="background:#222;color:#fff;margin-top:10px" onclick="forgotPassword()">Forgot Password</button></form><a class="back" href="/">← Back to Home</a><div class="hint">Super Admin can create and manage Admin accounts from the Admin Panel. There is no public Admin registration.</div></main><script>const f=document.getElementById('loginForm'),msg=document.getElementById('msg');async function forgotPassword(){const email=document.getElementById('email').value.trim().toLowerCase()||prompt('Enter your admin email:');if(!email)return;try{const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});const d=await r.json();if(d.reset_token)msg.textContent='Development reset token: '+d.reset_token;else msg.textContent=d.message}catch(e){msg.textContent='Unable to request reset.'}}f.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Signing in...';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Invalid credentials');if(!['ADMIN','SUPER_ADMIN'].includes(d.user.role))throw new Error('This login is only for Admin and Super Admin.');localStorage.setItem('rudra_user',JSON.stringify(d.user));localStorage.setItem('ra_user',JSON.stringify(d.user));location.href='/admin';}catch(err){msg.textContent=err.message}});</script></body></html>
