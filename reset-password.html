<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — Rudra Arts</title><style>body{font-family:Arial,sans-serif;background:#080808;color:#fff;min-height:100vh;display:grid;place-items:center;margin:0}.card{width:min(430px,92vw);background:#151515;border:1px solid #333;border-radius:18px;padding:28px}input,button{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#0d0d0d;color:#fff}button{background:#ff8a00;color:#111;font-weight:800;border:0;cursor:pointer}.msg{min-height:24px;color:#aaa}</style></head><body><main class="card"><h1>RUDRA ARTS <span style="color:#ff8a00">#1771</span></h1><h2>Reset Password</h2><input id="token" placeholder="Reset token"><input id="password" type="password" minlength="8" placeholder="New password (8+ characters)"><button onclick="reset()">Reset Password</button><p class="msg" id="msg"></p></main><script>async function reset(){const token=document.getElementById('token').value.trim(),password=document.getElementById('password').value;if(!token||password.length<8){msg.textContent='Enter a valid token and password of at least 8 characters.';return}const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,new_password:password})});const d=await r.json();msg.textContent=d.error||'Password reset successfully.'}</script></body></html>
